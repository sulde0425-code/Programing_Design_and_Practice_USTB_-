<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Text Retrieval System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .search-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .search-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #ffd700;
        }

        .search-mode {
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            cursor: pointer;
        }

        .search-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
        }

        .suggestions {
            position: absolute;
            background: #2a2a4e;
            border: 1px solid #444;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: #3a3a5e;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            color: #888;
            margin-top: 5px;
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: 1fr;
            }
        }

        .results-list, .result-detail {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .results-header {
            font-size: 1.2rem;
            color: #ffd700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .result-item {
            padding: 12px 15px;
            margin: 5px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(255,215,0,0.1);
        }

        .result-item.active {
            background: rgba(255,215,0,0.2);
            border-left: 3px solid #ffd700;
        }

        .result-book {
            font-weight: bold;
            color: #ffd700;
        }

        .result-location {
            font-size: 0.9rem;
            color: #888;
        }

        .context-text {
            font-family: 'Georgia', serif;
            line-height: 1.8;
            font-size: 1.1rem;
            color: #ddd;
        }

        .highlight {
            background: rgba(255,215,0,0.3);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .top-words {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .word-tag {
            background: rgba(255,215,0,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .word-tag:hover {
            background: rgba(255,215,0,0.4);
        }

        .word-count {
            font-size: 0.8rem;
            color: #888;
            margin-left: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .para-section {
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .para-section.current-para {
            background: rgba(255,215,0,0.08);
            border-left: 3px solid #ffd700;
        }

        .para-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .para-content {
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Harry Potter Text Retrieval</h1>
            <p>Search through the magical world of Harry Potter</p>
            <p style="margin-top:12px;">
                <a href="/upload.html" style="color:#ffd700;font-weight:bold;text-decoration:none;border:1px solid #ffd700;border-radius:8px;padding:8px 14px;display:inline-block;">
                    Upload TXT Files
                </a>
            </p>
        </header>

        <div class="search-box">
            <div class="search-row">
                <select class="search-mode" id="searchMode">
                    <option value="single">Single Word</option>
                    <option value="and">AND Query</option>
                    <option value="or">OR Query</option>
                    <option value="phrase">Phrase</option>
                </select>
                <div style="position: relative; flex: 1; min-width: 300px;">
                    <input type="text" class="search-input" id="searchInput"
                           placeholder="Enter your search query...">
                    <div class="suggestions" id="suggestions"></div>
                </div>
                <button class="search-btn" onclick="search()">Search</button>
            </div>
        </div>

        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-value" id="statDocs">-</div>
                <div class="stat-label">Books</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statVocab">-</div>
                <div class="stat-label">Unique Words</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTerms">-</div>
                <div class="stat-label">Total Terms</div>
            </div>
        </div>

        <div class="results-container" id="resultsContainer" style="display: none;">
            <div class="results-list">
                <div class="results-header">
                    Results: <span id="resultCount">0</span>
                </div>
                <div id="resultsList"></div>
            </div>
            <div class="result-detail">
                <div class="results-header">Context</div>
                <div class="context-text" id="contextText">
                    Select a result to view context...
                </div>
            </div>
        </div>

        <div class="top-words" id="topWordsSection">
            <div class="results-header">Top Words</div>
            <div class="word-list" id="wordList"></div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        // 加载统计信息
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/stats`);
                const data = await res.json();

                document.getElementById('statDocs').textContent = data.documents;
                document.getElementById('statVocab').textContent =
                    data.vocabulary.toLocaleString();
                document.getElementById('statTerms').textContent =
                    data.totalTerms.toLocaleString();
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        // 加载高频词
        async function loadTopWords() {
            try {
                const res = await fetch(`${API_BASE}/api/top?n=30`);
                const data = await res.json();

                const wordList = document.getElementById('wordList');
                wordList.innerHTML = data.words.map(w => `
                    <span class="word-tag" onclick="searchWord('${w.word}')">
                        ${w.word}<span class="word-count">${w.count}</span>
                    </span>
                `).join('');
            } catch (e) {
                console.error('Failed to load top words:', e);
            }
        }

        // 搜索单词
        function searchWord(word) {
            document.getElementById('searchInput').value = word;
            document.getElementById('searchMode').value = 'single';
            search();
        }

        // 搜索
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            const mode = document.getElementById('searchMode').value;

            if (!query) return;

            const resultsContainer = document.getElementById('resultsContainer');
            const resultsList = document.getElementById('resultsList');

            resultsContainer.style.display = 'grid';
            resultsList.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

            try {
                const res = await fetch(
                    `${API_BASE}/api/search?q=${encodeURIComponent(query)}&mode=${mode}`
                );
                const data = await res.json();

                document.getElementById('resultCount').textContent = data.count;

                if (data.results.length === 0) {
                    resultsList.innerHTML = '<div class="loading">No results found</div>';
                    return;
                }

                // 存储搜索结果数据
                window.searchResults = data.results;
                window.searchQuery = query;

                resultsList.innerHTML = data.results.map((r, i) => `
                    <div class="result-item" onclick="showContextAPI(${i}, this)"
                         data-doc="${r.book}" data-line="${r.line}">
                        <div class="result-location">
                            <span style="color:#ffd700;font-weight:bold;">#${i+1}</span>
                            <span style="color:#aaa;margin:0 8px;">|</span>
                            <span style="color:#88f;">${escapeHtml(query)}</span>
                            <span style="color:#aaa;margin:0 8px;">|</span>
                            Line ${r.line}
                            <span style="color:#aaa;margin:0 8px;">|</span>
                            Ch.${r.chapter}
                        </div>
                        <div class="result-book">${r.bookName}</div>
                    </div>
                `).join('');

                // 显示第一个结果的上下文
                const firstItem = resultsList.querySelector('.result-item');
                if (firstItem) {
                    showContextAPI(0, firstItem);
                }
            } catch (e) {
                resultsList.innerHTML = '<div class="loading">Search failed</div>';
                console.error('Search failed:', e);
            }
        }

        // 显示上下文（使用API获取前后段落）
        async function showContextAPI(index, element) {
            // 移除其他 active 状态
            document.querySelectorAll('.result-item').forEach(el => {
                el.classList.remove('active');
            });
            element.classList.add('active');

            const docId = element.dataset.doc;
            const line = element.dataset.line;
            const query = window.searchQuery || '';
            const contextDiv = document.getElementById('contextText');

            contextDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Loading context...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/context?doc=${docId}&line=${line}`);
                const data = await res.json();

                if (data.error) {
                    contextDiv.innerHTML = `<div class="loading">${data.error}</div>`;
                    return;
                }

                // 高亮搜索词的函数
                function highlightText(text) {
                    let highlighted = escapeHtml(text);
                    if (query) {
                        const words = query.toLowerCase().split(/\s+/);
                        words.forEach(word => {
                            if (word.length > 2) {
                                const regex = new RegExp(`(${word})`, 'gi');
                                highlighted = highlighted.replace(regex,
                                    '<span class="highlight">$1</span>');
                            }
                        });
                    }
                    return highlighted.replace(/\n/g, '<br>');
                }

                let html = `<div style="margin-bottom:20px;color:#ffd700;font-weight:bold;">
                    ${data.bookName} - Line ${data.line}
                </div>`;

                html += `<div class="para-section">
                    <div class="para-label">--- Previous Paragraph ---</div>
                    <div class="para-content">${data.previousParagraph ? highlightText(data.previousParagraph) : '<em style="color:#666;">(Beginning of document)</em>'}</div>
                </div>`;

                html += `<div class="para-section current-para">
                    <div class="para-label">--- Current Paragraph ---</div>
                    <div class="para-content">${highlightText(data.currentParagraph)}</div>
                </div>`;

                html += `<div class="para-section">
                    <div class="para-label">--- Next Paragraph ---</div>
                    <div class="para-content">${data.nextParagraph ? highlightText(data.nextParagraph) : '<em style="color:#666;">(End of document)</em>'}</div>
                </div>`;

                contextDiv.innerHTML = html;
            } catch (e) {
                contextDiv.innerHTML = '<div class="loading">Failed to load context</div>';
                console.error('Context load failed:', e);
            }
        }

        // HTML 转义
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 自动补全
        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const value = this.value.trim();

            if (value.length < 2) {
                document.getElementById('suggestions').style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(
                        `${API_BASE}/api/autocomplete?prefix=${encodeURIComponent(value)}`
                    );
                    const data = await res.json();

                    const suggestions = document.getElementById('suggestions');
                    if (data.suggestions.length > 0) {
                        suggestions.innerHTML = data.suggestions.map(s => `
                            <div class="suggestion-item" onclick="selectSuggestion('${s}')">
                                ${s}
                            </div>
                        `).join('');
                        suggestions.style.display = 'block';
                    } else {
                        suggestions.style.display = 'none';
                    }
                } catch (e) {
                    console.error('Autocomplete failed:', e);
                }
            }, 200);
        });

        function selectSuggestion(word) {
            document.getElementById('searchInput').value = word;
            document.getElementById('suggestions').style.display = 'none';
        }

        // 点击其他地方关闭建议
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-input') &&
                !e.target.closest('.suggestions')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('suggestions').style.display = 'none';
                search();
            }
        });

        // 初始化
        loadStats();
        loadTopWords();
    </script>
</body>
</html>
